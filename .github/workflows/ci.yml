name: CI Pipeline (Flask + SQL Server + Cypress)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    # Servicios en segundo plano (Levantamos SQL Server local para las pruebas)
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "PasswordEikon2026!"
        ports:
          - 1433:1433

    steps:
      # 1. Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-size: '3.x'

      # 3. Instalar herramientas de sistema necesarias para pyodbc en Linux
      - name: Install SQL Server ODBC Drivers (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      # 4. Instalar dependencias de Python
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pyodbc python-dotenv

      # 5. Crear archivo .env de prueba para el entorno virtual de GitHub
      - name: Create temporary .env file
        run: |
          echo "SERVER=localhost" >> .env
          echo "DATABASE=tempdb" >> .env
          echo "UID=sa" >> .env
          echo "PWD=PasswordEikon2026!" >> .env
          echo "TABLE=colaboradores" >> .env

      # 6. Levantar la aplicación de Flask en segundo plano
      - name: Start Flask App
        run: |
          python ./app/app.py &
        env:
          FLASK_ENV: testing

      # 7. Ejecutar las pruebas E2E con Cypress
      # Esta acción oficial de Cypress se encarga de instalar Node, Cypress y correr los tests
      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'http://127.0.0.1:5000' # Espera a que Flask esté activo antes de iniciar
          wait-on-timeout: 60